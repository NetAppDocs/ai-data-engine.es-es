---
indexpage:
  title: Documentación de AI Data Engine
  summary: La documentación de AI Data Engine explica cómo implementar, conectar fuentes
    de datos y usar AI Data Engine para la optimización del almacenamiento, la investigación
    de metadatos, la gobernanza de datos y el acceso gobernado a la IA a través de
    MCP.
  keywords: ai data engine, aide, storage optimization, investigation, policies, data
    governance, NetApp Console, governed ai access, mcp, model context protocol
  lead: AI Data Engine es un servicio de inteligencia de metadatos, gestionado a través
    de NetApp Console, que escanea tus sistemas conectados, crea un catálogo de metadatos
    y te ofrece la visibilidad y las herramientas necesarias para optimizar el almacenamiento
    y gobernar los datos a gran escala. Con acceso gobernado a la IA, los clientes
    de IA pueden buscar esos metadatos a través de Model Context Protocol (MCP).
